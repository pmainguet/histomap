notes: Editorial grouping (10 September 2026, China/Russia/Turkey/Indonesia/Iran/
  Greece/Poland/UK/Syria/Ukraine/Iraq/Yemen detail_of review) for ~11 Kievan Rus'-era
  and post-fragmentation appanage principalities on the territory of modern Ukraine
  (Novgorod-Seversk, Volhynia, Chernigov, Terebovlia, and similar) -- each independently
  reviewed and rendering as a top-level entity, none a bounded phase of a single continuous
  polity. Not a claim of shared sovereignty or lineage between rival members -- a
  plain container grouping by shared era/region, same construct as princely_states_of_india.
  Left Principality of Kyiv (a much broader-spanning record) and Kievan Rus' itself
  out, along with the more individually significant Kingdom of Galicia-Volhynia.
