notes: Editorial grouping (10 September 2026) for the ~23 rival regional governments,
  Warlord Era factions, and Japanese-sponsored puppet states (Manchukuo, Mengjiang,
  the Wang Jingwei regime, and similar) active in China between the 1911 Revolution
  and the 1949 Communist victory. Deliberately NOT attached to republic_of_china or
  people_s_republic_of_china via detail_of -- most of these were rival or foreign-imposed
  administrations that the internationally-recognized Chinese government never controlled
  or recognized, so detail_of would misrepresent them as a subordinate part of it
  (same reasoning as Biafra/Vichy France elsewhere in this dataset). A plain container
  grouping by shared era/category only, not sovereignty or lineage.
