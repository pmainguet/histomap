notes: Editorial grouping (ROADMAP.md item 5 follow-up, 10 September 2026) for ancient
  and medieval Indian kingdoms, dynasties, empires, and sultanates that had already
  ceased to exist as independent states before the British-paramountcy princely-state
  era (Maurya Empire, Chola dynasty, Vijayanagara Empire, Mughal Empire, Maratha Empire,
  and roughly 95 more) -- each was its own independently reviewed record that crowded
  India's region buckets with hundreds of top-level bands. Not a claim of a shared
  lineage or sovereign relationship between these polities, many of which were rivals
  or existed centuries apart -- a plain container grouping by shared historical era/category,
  not by descent. See also princely_states_of_india, its sibling grouping for the
  later British-era vassal states that survived into the 1947-1950 accession wave.
