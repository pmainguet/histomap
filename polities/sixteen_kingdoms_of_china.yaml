notes: Editorial grouping (10 September 2026) for the ~26 short-lived states of the
  Sixteen Kingdoms era (mostly Wu Hu/"Five Barbarians" states in northern China following
  the Western Jin's collapse, plus Cheng Han in the southwest) -- each independently
  reviewed and rendering as a top-level entity, none a bounded phase of a single continuous
  polity (the "Sixteen Kingdoms" is a historiographical period label, not a state).
  Not a claim of shared sovereignty or lineage between rival, often warring, members
  -- a plain container grouping by shared era, same construct as princely_states_of_india.
