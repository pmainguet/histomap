notes: Editorial grouping (10 September 2026) for the ~38 Turkish beyliks and principalities
  of Anatolia between the Seljuk victory at Manzikert (1071) and the beyliks' final
  absorption by the Ottoman Empire -- each independently reviewed and rendering as
  a top-level entity, none a bounded phase of a single continuous polity (the "Beylik
  period" is a historiographical label, not a state). Not a claim of shared sovereignty
  or lineage between rival, often warring, members -- a plain container grouping by
  shared era/category, same construct as princely_states_of_india. Left the Beylik
  of Osman out deliberately -- it shares the Ottoman Empire's own 1299 start year
  and is usually treated as its earliest phase rather than a peer beylik.
