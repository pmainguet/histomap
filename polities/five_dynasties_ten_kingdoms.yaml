notes: Editorial grouping (10 September 2026) for the ~30 states of the Five Dynasties
  and Ten Kingdoms era following the Tang dynasty's collapse (the five successive
  northern dynasties -- Later Liang/Tang/Jin/Han/Zhou -- plus the ten (or more) southern/regional
  kingdoms -- Wu, Wuyue, Min, Southern Han, Chu, Former/Later Shu, Southern Tang,
  Northern Han, Jingnan, and several smaller/shorter-lived states). Not a claim of
  shared sovereignty or lineage between rival, often warring, members -- a plain container
  grouping by shared era, same construct as princely_states_of_india.
