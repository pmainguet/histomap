notes: Mesopotamia spans several distinct political phases (Uruk, Sumerian city-states,
  the Akkadian Empire, Babylonia, ...); rendered as period context in the
  Civilizations & Cultures lane so those phases (now plain polities, not this
  civilization-level record) carry the chart's political weight. Replaces the
  earlier arrangement where Sumer/Akkadian Empire/Uruk/Babylonia individually
  carried civilization-lane weight -- see STATUS.md. mesopotamian_early_states_era
  (the regional_era) is unchanged and still anchors Early Dynastic Mesopotamia's
  own placement in the ordinary Period row; this record is the Civilizations &
  Cultures lane's counterpart to it, the same relationship Ancient Egypt/Babylonia
  already had to their own eras before Egyptian Early States was retired.
