notes: Overarching parent for the regional Classical Antiquity eras (mediterranean_classical_era,
  east_asian_classical_era, south_asian_classical_era, mesoamerican_formative_classic_era,
  andean_early_civilizations_era), which happened at meaningfully different times
  in different places -- same "overarching regional era" treatment as bronze_age_era/neolithic_era/
  paleolithic_era/iron_age_era. Spans from the earliest regional start (-1200, shared
  by Mediterranean/Mesoamerican/Andean) to the latest regional end (900, Mesoamerican).
  Deliberately excludes Sub-Saharan Africa, whose equivalent-period record is iron_age_era,
  not a "classical antiquity" -- see ONTOLOGY.md's "Overarching regional eras for
  genuinely cross-regional themes" and STATUS.md.
