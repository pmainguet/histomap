notes: Ancient Greece spans several distinct political phases (Mycenaean Greece,
  the Archaic and Classical city-states, the Hellenistic kingdoms); rendered as
  period context in the Civilizations & Cultures lane so those phases (individual
  polities like the Delian League, Macedonian Empire, etc.) carry the chart's
  political weight -- same treatment as ancient_egypt_period and mesopotamia_period.
