<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histomap — explore human history</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Histomap timeline">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M5 6h7v24H5zM15 11h7v19h-7zM25 3h7v27h-7z"/></svg>
        <span>Histomap</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/">Timeline</a>
        <a href="/explore" aria-current="page">Explore</a>
        <a href="/reviews">Reviews</a>
        <a href="/docs">API</a>
      </nav>
    </header>
    <section class="explore-intro" aria-label="About this view">
      <h1>Explore human history</h1>
      <p>Nine chapters, oldest first. Click any band to zoom in on its date range.</p>
      <div class="controls">
        <button type="button" class="action-button" data-build-timeline hidden>Build timeline</button>
        <span data-build-status aria-live="polite"></span>
      </div>
    </section>
    <div class="hierarchy-controls" aria-label="Display options">
      <label for="show-polities"><input type="checkbox" id="show-polities" checked> Show polities</label>
      <label for="group-by">Group by</label>
      <select id="group-by">
        <option value="continent">Continent</option>
        <option value="country">Country</option>
        <option value="none">None</option>
      </select>
      <label for="geo-filter" id="geo-filter-label">Filter to</label>
      <select id="geo-filter">
        <option value="all">All</option>
      </select>
      <a href="#" id="zoom-reset" hidden>&larr; Full timeline</a>
    </div>
    <div id="hierarchy-legend" class="hierarchy-legend" aria-label="Band style legend">
      <span>Style</span>
      <i></i> Polity (solid)
      <i class="heuristic"></i> Civilization, culture, people, or tribe (dashed)
    </div>
    <div id="hierarchy-chart" class="hierarchy-chart-container" aria-label="Period hierarchy timeline">
      <p class="loading">Loading…</p>
    </div>
    <button id="detail-backdrop" class="detail-backdrop" type="button" aria-label="Close entity details" tabindex="-1"></button>
    <aside id="details" class="details detail-drawer" aria-live="polite" aria-hidden="true"></aside>
    <script src="/static/common.js"></script>
    <script src="/static/geological_epochs.js"></script>
    <script src="/static/timeline_scale.js"></script>
    <script src="/static/lane_packing.js"></script>
    <script src="/static/explore_timeline.js"></script>
    <script src="/static/explore_details.js"></script>
    <script src="/static/explore.js"></script>
    <script type="module" src="/static/review_build.js"></script>
  </body>
</html>
