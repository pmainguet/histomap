<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Histomap — explore human history</title>
    <link rel="stylesheet" href="/static/styles.css">
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="/" aria-label="Histomap timeline">
        <svg class="brand-mark" viewBox="0 0 36 36" aria-hidden="true"><path d="M5 6h7v24H5zM15 11h7v19h-7zM25 3h7v27h-7z"/></svg>
        <span>Histomap</span>
      </a>
      <nav aria-label="Main navigation">
        <a href="/">Timeline</a>
        <a href="/explore" aria-current="page">Explore</a>
        <a href="/reviews">Reviews</a>
        <a href="/docs">API</a>
      </nav>
    </header>
    <section class="explore-intro" aria-label="About this view">
      <h1>Explore human history</h1>
      <p>Nine chapters, oldest first. Click a chapter to open it on the full timeline.</p>
    </section>
    <div class="hierarchy-controls" aria-label="Polities display">
      <label for="polities-toggle">Show polities by</label>
      <select id="polities-toggle">
        <option value="historical_region">Historical region</option>
        <option value="continent">Present-day continent</option>
        <option value="none">Hidden</option>
      </select>
    </div>
    <div id="hierarchy-chart" class="hierarchy-chart-container" aria-label="Period hierarchy timeline">
      <p class="loading">Loading…</p>
    </div>
    <script src="/static/geological_epochs.js"></script>
    <script src="/static/timeline_scale.js"></script>
    <script src="/static/lane_packing.js"></script>
    <script src="/static/explore_timeline.js"></script>
    <script src="/static/explore.js"></script>
  </body>
</html>
